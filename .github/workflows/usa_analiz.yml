name: USA Portfolio Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manuel çalıştırma için ekledik

permissions:
  contents: read
  actions: write      # Summary dosyasını oluşturmak için bu izin şart

jobs:
  run-portfolio-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Apex Terminal
        env:
          PORTFOLIO_TYPE: "ABD"
          PORTFOLIO_CAPITAL: "10000"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Buraya başka env'lerin varsa ekleyebilirsin
        run: python main.py
