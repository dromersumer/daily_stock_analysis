name: USA Portfolio Watch & Strategy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manuel çalıştırma için

permissions:
  contents: read
  actions: write      # GitHub Summary sayfasına yazma izni

jobs:
  run-apex-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy

      - name: Run Apex Terminal Watcher
        run: python portfolio_watch.py

      - name: Run Strategy Engine
        env:
          # Opsiyonel: Eşiği özelleştirmek istersen buradan değiştir
          VOL_LOW_THRESHOLD: "30.0"
        run: python strategy_engine.py
