name: USA Portfolio Watch

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manuel çalıştırma için

permissions:
  contents: read
  actions: write      # Summary sayfasına yazma izni

jobs:
  run-portfolio-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # portfolio_watch.py için gerekli kütüphaneler
          pip install yfinance pandas requests

      - name: Run Apex Terminal Watcher
        env:
          # Eğer gelecekte API anahtarına ihtiyaç duyarsanız buraya ekleyebilirsiniz
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python portfolio_watch.py
