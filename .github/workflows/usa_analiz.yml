# .github/workflows/usa_analiz.yml
name: USA Analysis Engine

on:
  schedule:
    - cron: '0 20 * * 1-5'   # Hafta içi TSİ 23:00 (NYSE kapanışı sonrası)
  workflow_dispatch:

permissions:
  contents: read
  actions: write              # GITHUB_STEP_SUMMARY yazımı için zorunlu

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas requests numpy

      - name: Run Apex Terminal
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          VOL_LOW_THRESHOLD: "30.0"
        run: python main.py
