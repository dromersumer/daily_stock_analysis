# .github/workflows/usa_analiz.yml
name: USA Analysis Engine

on:
  schedule:
    - cron: '46 13 * * 1-5'  # Hafta içi her gün TSİ 16:46 (Açılıştan 16 dk sonra)
    - cron: '1 20 * * 1-5'   # Hafta içi her gün TSİ 23:01 (Kapanıştan 1 dk sonra)
  workflow_dispatch:

permissions:
  contents: read
  actions: write              # GITHUB_STEP_SUMMARY rapor yazımı için zorunlu

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 2 Haziran 2026 Node.js 20 kapanış koruması

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas requests numpy

      - name: Run Apex Terminal
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_URL_OZLEM: ${{ secrets.SHEET_URL_OZLEM }}
          VOL_LOW_THRESHOLD: "30.0"
        run: python main.py
